scenarios:
  # Basic echo tests
  - name: "echo_string_http"
    method: "echo_string"
    transport: "http"
    request:
      params: "hello world"
      id: 1
    expect:
      id: 1
      result: "hello world"

  - name: "echo_array_http"
    method: "echo_array"
    transport: "http"
    request:
      params:
        items: ["one", "two", "three"]
      id: "array-1"
    expect:
      id: "array-1"
      result:
        items: ["one", "two", "three"]

  - name: "echo_object_http"
    method: "echo_object"
    transport: "http"
    request:
      params:
        field1: "test"
        field2: 42
        field3: true
      id: 2
    expect:
      id: 2
      result:
        field1: "test"
        field2: 42
        field3: true

  - name: "echo_map_http"
    method: "echo_map"
    transport: "http"
    request:
      params:
        data:
          key1: "value1"
          key2: "value2"
      id: 3
    expect:
      id: 3
      result:
        data:
          key1: "value1"
          key2: "value2"

  # Transform tests
  - name: "transform_string_http"
    method: "transform_string"
    transport: "http"
    request:
      params: "hello"
      id: 4
    expect:
      id: 4
      result: "HELLO"

  - name: "transform_array_http"
    method: "transform_array"
    transport: "http"
    request:
      params:
        items: ["a", "b", "c"]
      id: 5
    expect:
      id: 5
      result:
        items: ["c", "b", "a"]  # Reversed

  - name: "transform_object_http"
    method: "transform_object"
    transport: "http"
    request:
      params:
        field1: "lower"
        field2: 21
        field3: false
      id: 6
    expect:
      id: 6
      result:
        field1: "LOWER"  # Uppercase
        field2: 42       # Doubled
        field3: true     # Negated

  - name: "transform_map_http"
    method: "transform_map"
    transport: "http"
    request:
      params:
        data:
          key: "value"
          another: "test"
      id: 7
    expect:
      id: 7
      result:
        data:
          transformed_key: "value"      # Keys prefixed with "transformed_"
          transformed_another: "test"

  # Generate tests
  - name: "generate_string_http"
    method: "generate_string"
    transport: "http"
    request:
      id: 8
    expect:
      id: 8
      result: "generated-string"

  - name: "generate_array_http"
    method: "generate_array"
    transport: "http"
    request:
      id: 9
    expect:
      id: 9
      result:
        items: ["item1", "item2", "item3"]

  - name: "generate_object_http"
    method: "generate_object"
    transport: "http"
    request:
      id: 10
    expect:
      id: 10
      result:
        field1: "generated-value1"
        field2: 42
        field3: true

  - name: "generate_map_http"
    method: "generate_map"
    transport: "http"
    request:
      id: 11
    expect:
      id: 11
      result:
        data:
          generated: true
          count: 3
          status: "ok"

  # Notification tests (no response)
  - name: "echo_string_notify"
    method: "echo_string_notify"
    transport: "http"
    request:
      params: "notification"
      # No ID for notifications
    expect:
      no_response: true

  # Error tests
  # TODO: This test expects specific JSON-RPC error codes from Goa's transport layer
  # - name: "echo_string_error"
  #   method: "echo_string_error"
  #   transport: "http"
  #   request:
  #     params: "will fail"
  #     id: "err-1"
  #   expect:
  #     id: "err-1"
  #     error:
  #       code: -32602
  #       message: "Invalid params"


  # SSE streaming without final response
  - name: "stream_object_sse"
    method: "stream_object_sse"
    transport: "sse"
    request:
      params: 
        field1: "test"
        field2: 123
        field3: true
      id: "sse-2"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_sse"
          params:
            field1: "notification"
            field2: 1
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_sse"
          params:
            field1: "notification"
            field2: 2
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_sse"
          params:
            field1: "notification"
            field2: 3
            field3: true

  # SSE streaming with final response
  # TODO: Goa SSE has a bug where it doesn't check the ID field in streaming results
  # For now, we can only send notifications
  - name: "stream_string_final_sse"
    method: "stream_string_final_sse"
    transport: "sse"
    request:
      params: "progress"
      id: "sse-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_final_sse"
          params:
            value: "Progress: 25%"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_final_sse"
          params:
            value: "Progress: 50%"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_final_sse"
          params:
            value: "Progress: 75%"

  # WebSocket tests - TODO: Fix ID field mapping for bidirectional streaming
  # - name: "echo_string_websocket"
  #   method: "echo_string_ws"
  #   transport: "websocket"
  #   sequence:
  #     - type: "connect"
  #     - type: "send"
  #       data:
  #         jsonrpc: "2.0"
  #         method: "echo_string_ws"
  #         params: "hello websocket"
  #         id: "ws-1"
  #     - type: "receive"
  #       expect:
  #         jsonrpc: "2.0"
  #         id: "ws-1"
  #         result: "hello websocket"
  #     - type: "close"

  # # WebSocket with server broadcasts
  # - name: "broadcast_string_websocket"
  #   method: "broadcast_string_ws"
  #   transport: "websocket"
  #   sequence:
  #     - type: "connect"
  #     - type: "receive"
  #       expect:
  #         jsonrpc: "2.0"
  #         method: "broadcast_string_ws"
  #         params: "Server announcement 1"
  #     - type: "receive"
  #       expect:
  #         jsonrpc: "2.0"
  #         method: "broadcast_string_ws"
  #         params: "Server announcement 2"
  #     - type: "close"

  # WebSocket bidirectional streaming
  - name: "collect_array_websocket"
    method: "collect_array_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          method: "collect_array_ws"
          params:
            id: "collect-1"
            items: ["first"]
          id: "collect-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "collect-1"
          result:
            items: ["first"]
      - type: "send"
        data:
          method: "collect_array_ws"
          params:
            id: "collect-2"
            items: ["second"]
          id: "collect-2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "collect-2"
          result:
            items: ["first", "second"]
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "collect_array_ws"
          params:
            id: "collect-3"
            items: ["third"]
          id: "collect-3"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "collect-3"
          result:
            items: ["first", "second", "third"]

  # Batch request tests
  - name: "batch_mixed_requests"
    transport: "http"
    batch:
      - method: "echo_string"
        params: "hello"
        id: "batch-1"
      - method: "generate_array"
        id: "batch-2"
      - method: "echo_string"
        params: "notification in batch"
        # No ID for notifications
    expect_batch:
      - id: "batch-1"
        result: "hello"
      - id: "batch-2"
        result:
          items: ["item1", "item2", "item3"]
      - result: "notification in batch"  # Goa returns result even for notifications

  # Invalid request tests
  # TODO: Goa doesn't return proper JSON-RPC error for invalid JSON
  # - name: "invalid_json"
  #   transport: "http"
  #   raw_request: '{"jsonrpc": "2.0", "method": "echo_string", "params": "test", "id": 1'  # Missing closing brace
  #   expect:
  #     error:
  #       code: -32700
  #       message: "Parse error"

  # TODO: This test expects Goa to validate JSON-RPC protocol version
  # - name: "missing_jsonrpc_version"
  #   transport: "http"
  #   request:
  #     method: "echo_string"
  #     params: "test"
  #     id: "no-version"
  #   expect:
  #     id: "no-version"
  #     error:
  #       code: -32600
  #       message: "Invalid request"

  - name: "method_not_found"
    transport: "http"
    request:
      method: "non_existent_method"
      params: "test"
      id: "not-found"
    expect:
      id: "not-found"
      error:
        code: -32601
        message: "Method not found"

  # Edge case tests
  - name: "null_id"
    transport: "http"
    request:
      method: "echo_string"
      params: "test with null id"
      id: null
    expect:
      id: null
      result: "test with null id"

  - name: "numeric_string_id"
    transport: "http"
    request:
      method: "echo_string"
      params: "test"
      id: "12345"
    expect:
      id: "12345"
      result: "test"

  - name: "empty_params_object"
    transport: "http"
    request:
      method: "generate_string"
      params: {}
      id: "empty-params"
    expect:
      id: "empty-params"
      result: "generated-string"


settings:
  timeout: "30s"
  base_url: ""  # Will use default from server