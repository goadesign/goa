scenarios:
  # Basic echo tests
  - name: "echo_string_http"
    method: "echo_string"
    transport: "http"
    request:
      params: "hello world"
      id: 1
    expect:
      id: 1
      result: "hello world"

  - name: "echo_array_http"
    method: "echo_array"
    transport: "http"
    request:
      params:
        items: ["one", "two", "three"]
      id: "array-1"
    expect:
      id: "array-1"
      result:
        items: ["one", "two", "three"]

  - name: "echo_object_http"
    method: "echo_object"
    transport: "http"
    request:
      params:
        field1: "test"
        field2: 42
        field3: true
      id: 2
    expect:
      id: 2
      result:
        field1: "test"
        field2: 42
        field3: true

  - name: "echo_map_http"
    method: "echo_map"
    transport: "http"
    request:
      params:
        data:
          key1: "value1"
          key2: "value2"
      id: 3
    expect:
      id: 3
      result:
        data:
          key1: "value1"
          key2: "value2"

  # Transform tests
  - name: "transform_string_http"
    method: "transform_string"
    transport: "http"
    request:
      params: "hello"
      id: 4
    expect:
      id: 4
      result: "HELLO"

  - name: "transform_array_http"
    method: "transform_array"
    transport: "http"
    request:
      params:
        items: ["a", "b", "c"]
      id: 5
    expect:
      id: 5
      result:
        items: ["c", "b", "a"]  # Reversed

  - name: "transform_object_http"
    method: "transform_object"
    transport: "http"
    request:
      params:
        field1: "lower"
        field2: 21
        field3: false
      id: 6
    expect:
      id: 6
      result:
        field1: "LOWER"  # Uppercase
        field2: 42       # Doubled
        field3: true     # Negated

  - name: "transform_map_http"
    method: "transform_map"
    transport: "http"
    request:
      params:
        data:
          key: "value"
          another: "test"
      id: 7
    expect:
      id: 7
      result:
        data:
          transformed_key: "value"      # Keys prefixed with "transformed_"
          transformed_another: "test"

  # Generate tests
  - name: "generate_string_http"
    method: "generate_string"
    transport: "http"
    request:
      id: 8
    expect:
      id: 8
      result: "generated-string"

  - name: "generate_array_http"
    method: "generate_array"
    transport: "http"
    request:
      id: 9
    expect:
      id: 9
      result:
        items: ["item1", "item2", "item3"]

  - name: "generate_object_http"
    method: "generate_object"
    transport: "http"
    request:
      id: 10
    expect:
      id: 10
      result:
        field1: "generated-value1"
        field2: 42
        field3: true

  - name: "generate_map_http"
    method: "generate_map"
    transport: "http"
    request:
      id: 11
    expect:
      id: 11
      result:
        data:
          generated: true
          count: 3
          status: "ok"

  # Notification tests (no response)
  - name: "echo_string_notify"
    method: "echo_string_notify"
    transport: "http"
    request:
      params: "notification"
      # No ID for notifications
    expect:
      no_response: true

  # Error tests
  - name: "echo_string_error"
    method: "echo_string_error"
    transport: "http"
    request:
      params: "will fail"
      id: "err-1"
    expect:
      id: "err-1"
      error:
        code: -32602
        message: "Invalid params"


  # SSE streaming without final response
  - name: "stream_object_sse"
    method: "stream_object_sse"
    transport: "sse"
    request:
      params: 
        field1: "test"
        field2: 3  # This controls the number of notifications
        field3: true
      id: "sse-2"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_sse"
          params:
            field1: "test-1"
            field2: 1
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_sse"
          params:
            field1: "test-2"
            field2: 2
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_sse"
          params:
            field1: "test-3"
            field2: 3
            field3: true  # Last item is true

  # SSE streaming with final response
  - name: "stream_string_final_sse"
    method: "stream_string_final_sse"
    transport: "sse"
    request:
      params: "abc"  # Length 3 = 3 notifications
      id: "sse-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_final_sse"
          params:
            value: "Stream 1 of 3"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_final_sse"
          params:
            value: "Stream 2 of 3"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_final_sse"
          params:
            value: "Stream 3 of 3"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "sse-1"
          result:
            value: "Final response"

  # SSE additional streaming tests
  - name: "stream_array_sse"
    method: "stream_array_sse"
    transport: "sse"
    request:
      params:
        items: ["first", "second"]  # Each item will be streamed
      id: "sse-array-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_array_sse"
          params:
            items: ["Processing: first"]
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_array_sse"
          params:
            items: ["Processing: second"]

  - name: "stream_map_sse"
    method: "stream_map_sse"
    transport: "sse"
    request:
      params:
        data:
          key1: "value1"
          key2: "value2"
      id: "sse-map-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_map_sse"
          params:
            data:
              key: "key1"
              value: "value1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_map_sse"
          params:
            data:
              key: "key2"
              value: "value2"

  - name: "stream_string_sse"
    method: "stream_string_sse"
    transport: "sse"
    request:
      params: "hi"  # Length 2 = 2 notifications
      id: "sse-string-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 1 of 2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 2 of 2"

  # SSE with final modifier - stream then send final response
  - name: "stream_array_final_sse"
    method: "stream_array_final_sse"
    transport: "sse"
    request:
      params:
        items: ["item1", "item2"]
      id: "sse-array-final-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_array_final_sse"
          params:
            items: ["Processing: item1"]
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_array_final_sse"
          params:
            items: ["Processing: item2"]
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "sse-array-final-1"
          result:
            items: ["completed"]

  - name: "stream_object_final_sse"
    method: "stream_object_final_sse"
    transport: "sse"
    request:
      params:
        field1: "start"
        field2: 3  # Count of notifications before final
        field3: false
      id: "sse-obj-final-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_final_sse"
          params:
            field1: "start-1"
            field2: 1
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_final_sse"
          params:
            field1: "start-2"
            field2: 2
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_final_sse"
          params:
            field1: "start-3"
            field2: 3
            field3: true  # Last is true
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "sse-obj-final-1"
          result:
            field1: "completed"
            field2: 100
            field3: true

  - name: "stream_map_final_sse"
    method: "stream_map_final_sse"
    transport: "sse"
    request:
      params:
        data:
          first: "value1"
          second: "value2"
      id: "sse-map-final-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_map_final_sse"
          params:
            data:
              key: "first"
              value: "value1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_map_final_sse"
          params:
            data:
              key: "second"
              value: "value2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "sse-map-final-1"
          result:
            data:
              status: "completed"
              final: true

  # SSE error scenario - stream then error
  - name: "stream_string_error_sse"
    method: "stream_string_error_sse"
    transport: "sse"
    request:
      params: "ab"  # 2 chars = 2 notifications before error
      id: "sse-err-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_error_sse"
          params:
            value: "Stream 1 of 2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_error_sse"
          params:
            value: "Stream 2 of 2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "sse-err-1"
          error:
            code: -32602
            message: "Streaming error occurred"

  # SSE with no ID (pure notifications)
  - name: "stream_string_notify_sse"
    method: "stream_string_notify_sse"
    transport: "sse"
    request:
      params: "abc"  # 3 chars = 3 notifications
      # No ID - pure notification stream
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_notify_sse"
          params:
            value: "Stream 1 of 3"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_notify_sse"
          params:
            value: "Stream 2 of 3"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_notify_sse"
          params:
            value: "Stream 3 of 3"

  # SSE edge cases and additional tests
  # Empty array test - streams single "empty" notification
  - name: "stream_array_empty_sse"
    method: "stream_array_sse"
    transport: "sse"
    request:
      params:
        items: []  # Empty array
      id: "sse-empty-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_array_sse"
          params:
            items: ["empty"]

  # Single string stream - one character = one notification
  - name: "stream_string_single_sse"
    method: "stream_string_sse"
    transport: "sse"
    request:
      params: "x"  # Length 1 = 1 notification
      id: "sse-single-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 1 of 1"

  # Multiple items streamed rapidly
  - name: "stream_string_multiple_sse"
    method: "stream_string_sse"
    transport: "sse"
    request:
      params: "12345"  # Length 5 = 5 notifications
      id: "sse-rapid-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 1 of 5"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 2 of 5"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 3 of 5"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 4 of 5"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_sse"
          params:
            value: "Stream 5 of 5"

  # Stream with count control then final response
  - name: "stream_object_count_final_sse"
    method: "stream_object_final_sse"
    transport: "sse"
    request:
      params:
        field1: "test"
        field2: 2  # This controls the count of notifications
        field3: true
      id: "sse-mixed-1"
    sequence:
      # Notifications based on field2 count
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_final_sse"
          params:
            field1: "test-1"
            field2: 1
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_final_sse"
          params:
            field1: "test-2"
            field2: 2
            field3: true  # Last item is true
      # Then the final response with ID
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "sse-mixed-1"
          result:
            field1: "completed"
            field2: 100
            field3: true

  # Echo test for SSE
  - name: "echo_string_sse"
    method: "echo_string_sse"
    transport: "sse"
    request:
      params: "echo this"
      id: "sse-echo-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "echo_string_sse"
          params:
            value: "echo this"

  # Transform test for SSE
  - name: "transform_string_sse"
    method: "transform_string_sse"
    transport: "sse"
    request:
      params: "hello world"
      id: "sse-transform-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "transform_string_sse"
          params:
            value: "HELLO WORLD"

  # Generate test for SSE
  - name: "generate_string_sse"
    method: "generate_string_sse"
    transport: "sse"
    request:
      params: "ignored"
      id: "sse-generate-1"
    sequence:
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "generate_string_sse"
          params:
            value: "generated-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "generate_string_sse"
          params:
            value: "generated-2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "generate_string_sse"
          params:
            value: "generated-3"

  # WebSocket tests - TODO: Fix ID field mapping for bidirectional streaming
  - name: "echo_string_websocket"
    method: "echo_string_ws"
    transport: "websocket"
    sequence:
      - type: "connect"
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "echo_string_ws"
          params:
            id: "ws-1"
            value: "hello websocket"
          id: "ws-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-1"
          result:
            value: "hello websocket"
      - type: "close"

  # WebSocket with server broadcasts
  - name: "broadcast_string_websocket"
    method: "broadcast_string_ws"
    transport: "websocket"
    sequence:
      - type: "connect"
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "broadcast_string_ws"
          params:
            id: "subscribe"
            value: "start"
          id: "broadcast-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "broadcast_string_ws"
          params:
            value: "Server announcement 1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "broadcast_string_ws"
          params:
            value: "Server announcement 2"
      - type: "close"

  # WebSocket transform tests
  - name: "transform_string_websocket"
    method: "transform_string_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "transform_string_ws"
          params:
            id: "ws-transform-1"
            value: "hello"
          id: "ws-transform-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-transform-1"
          result:
            value: "HELLO"
      - type: "close"

  - name: "transform_object_websocket"
    method: "transform_object_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "transform_object_ws"
          params:
            id: "ws-obj-1"
            field1: "lower"
            field2: 10
            field3: false
          id: "ws-obj-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-obj-1"
          result:
            field1: "LOWER"
            field2: 20
            field3: true
      - type: "close"

  - name: "transform_map_websocket"
    method: "transform_map_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "transform_map_ws"
          params:
            id: "ws-map-1"
            data:
              key1: "value1"
              key2: "value2"
          id: "ws-map-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-map-1"
          result:
            data:
              transformed_key1: "value1"
              transformed_key2: "value2"
      - type: "close"

  # WebSocket generate tests
  - name: "generate_string_websocket"
    method: "generate_string_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "generate_string_ws"
          params:
            id: "ws-gen-1"
            value: "ignored"
          id: "ws-gen-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-gen-1"
          result:
            value: "generated-string"
      - type: "close"

  - name: "generate_array_websocket"
    method: "generate_array_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "generate_array_ws"
          params:
            id: "ws-gen-array-1"
            items: []  # Ignored
          id: "ws-gen-array-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-gen-array-1"
          result:
            items: ["item1", "item2", "item3"]
      - type: "close"

  - name: "generate_object_websocket"
    method: "generate_object_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "generate_object_ws"
          params:
            id: "ws-gen-obj-1"
            field1: ""
            field2: 0
            field3: false
          id: "ws-gen-obj-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-gen-obj-1"
          result:
            field1: "generated-value1"
            field2: 42
            field3: true
      - type: "close"

  # WebSocket stream tests (server streaming)
  - name: "stream_string_websocket"
    method: "stream_string_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "stream_string_ws"
          params:
            id: "ws-stream-1"
            value: "ab"  # 2 chars = 2 messages
          id: "ws-stream-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_ws"
          params:
            value: "Stream 1 of 2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_ws"
          params:
            value: "Stream 2 of 2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-stream-1"
          result:
            value: "completed"
      - type: "close"

  - name: "stream_array_websocket"
    method: "stream_array_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "stream_array_ws"
          params:
            id: "ws-stream-array-1"
            items: ["first", "second"]
          id: "ws-stream-array-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_array_ws"
          params:
            items: ["Processing: first"]
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_array_ws"
          params:
            items: ["Processing: second"]
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-stream-array-1"
          result:
            items: ["completed"]
      - type: "close"

  - name: "stream_object_websocket"
    method: "stream_object_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "stream_object_ws"
          params:
            id: "ws-stream-obj-1"
            field1: "test"
            field2: 2  # Controls stream count
            field3: false
          id: "ws-stream-obj-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_ws"
          params:
            field1: "test-1"
            field2: 1
            field3: false
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_object_ws"
          params:
            field1: "test-2"
            field2: 2
            field3: true
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-stream-obj-1"
          result:
            field1: "completed"
            field2: 100
            field3: true
      - type: "close"

  # WebSocket error handling tests
  - name: "echo_string_error_websocket"
    method: "echo_string_error_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "echo_string_error_ws"
          params:
            id: "ws-error-1"
            value: "will fail"
          id: "ws-error-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-error-1"
          error:
            code: -32602
            message: "Invalid params"
      - type: "close"

  - name: "stream_string_error_websocket"
    method: "stream_string_error_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "stream_string_error_ws"
          params:
            id: "ws-stream-error-1"
            value: "fail"
          id: "ws-stream-error-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_error_ws"
          params:
            value: "Stream 1 of 4"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          method: "stream_string_error_ws"
          params:
            value: "Stream 2 of 4"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-stream-error-1"
          error:
            code: -32602
            message: "Streaming error occurred"
      - type: "close"

  # WebSocket notification tests (no response expected)
  - name: "echo_string_notify_websocket"
    method: "echo_string_notify_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "echo_string_notify_ws"
          params:
            value: "notification"
          # No id field - this is a notification
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "echo_string_notify_ws"
          params:
            value: "another notification"
          # No id field
      # No receive expected for notifications
      - type: "close"

  # WebSocket validation test
  - name: "echo_object_validate_websocket"
    method: "echo_object_validate_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "echo_object_validate_ws"
          params:
            id: "ws-validate-1"
            field1: ""  # Empty string might fail validation
            field2: -1  # Negative number might fail validation
            field3: true
          id: "ws-validate-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "ws-validate-1"
          error:
            code: -32602
            message: "validation error"
      - type: "close"

  # WebSocket bidirectional streaming
  - name: "collect_array_websocket"
    method: "collect_array_ws"
    transport: "websocket"
    sequence:
      - type: "send"
        data:
          method: "collect_array_ws"
          params:
            id: "collect-1"
            items: ["first"]
          id: "collect-1"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "collect-1"
          result:
            items: ["first"]
      - type: "send"
        data:
          method: "collect_array_ws"
          params:
            id: "collect-2"
            items: ["second"]
          id: "collect-2"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "collect-2"
          result:
            items: ["first", "second"]
      - type: "send"
        data:
          jsonrpc: "2.0"
          method: "collect_array_ws"
          params:
            id: "collect-3"
            items: ["third"]
          id: "collect-3"
      - type: "receive"
        expect:
          jsonrpc: "2.0"
          id: "collect-3"
          result:
            items: ["first", "second", "third"]

  # Batch request tests
  - name: "batch_mixed_requests"
    transport: "http"
    batch:
      - method: "echo_string"
        params: "hello"
        id: "batch-1"
      - method: "generate_array"
        id: "batch-2"
      - method: "echo_string"
        params: "notification in batch"
        # No ID for notifications
    expect_batch:
      - id: "batch-1"
        result: "hello"
      - id: "batch-2"
        result:
          items: ["item1", "item2", "item3"]
      # Notification (no ID) should not return a response

  # Invalid request tests
  - name: "invalid_json"
    transport: "http"
    raw_request: '{"jsonrpc": "2.0", "method": "echo_string", "params": "test", "id": 1'  # Missing closing brace
    expect:
      error:
        code: -32700
        message: "Parse error"

  # TODO: This test expects Goa to validate JSON-RPC protocol version
  - name: "missing_jsonrpc_version"
    transport: "http"
    request:
      jsonrpc: "-"  # Special value "-" means omit the field entirely
      method: "echo_string"
      params: "test"
      id: "no-version"
    expect:
      id: "no-version"
      error:
        code: -32600
        message: "Invalid request"

  - name: "method_not_found"
    transport: "http"
    request:
      method: "non_existent_method"
      params: "test"
      id: "not-found"
    expect:
      id: "not-found"
      error:
        code: -32601
        message: "Method not found"

  # Edge case tests
  - name: "null_id"
    transport: "http"
    request:
      method: "echo_string"
      params: "test with null id"
      id: null
    expect:
      id: null
      result: "test with null id"

  - name: "numeric_string_id"
    transport: "http"
    request:
      method: "echo_string"
      params: "test"
      id: "12345"
    expect:
      id: "12345"
      result: "test"

  - name: "empty_params_object"
    transport: "http"
    request:
      method: "generate_string"
      params: {}
      id: "empty-params"
    expect:
      id: "empty-params"
      result: "generated-string"


settings:
  timeout: "30s"
  base_url: ""  # Will use default from server